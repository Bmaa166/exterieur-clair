<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">Pergola bioclimatique : prix et démarches (2026)</title>
<desc id="d">Prix 2026 d’une pergola bioclimatique : 450 à 1 000 € par m² posée (milieu de gamme 600 à 900 € par m²), budget d’environ 6 000 à 20 000 € pour 12 à 20 m², motorisation des lames 800 à 2 000 € (jusqu’à 2 500 € selon le type). Pergola indépendante : aucune formalité jusqu’à 5 m², déclaration préalable de 5 à 20 m², permis de construire au-delà de 20 m² ; adossée en zone U d’un PLU : déclaration jusqu’à 40 m². Livraison 2 à 4 semaines en kit, 6 à 10 semaines en sur-mesure, pose 1 à 3 jours ; avec une déclaration préalable (1 mois d’instruction), lancer le projet en février ou mars.</desc>
<defs><clipPath id="c"><rect width="720" height="380" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="380" fill="#f4f9fd"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#13232b">Pergola bioclimatique : prix et démarches</text>
<rect x="24" y="62" width="212" height="104" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="130" y="90" font-size="13" fill="#61747d" text-anchor="middle">Prix au m², posée</text>
<text x="130" y="118" font-size="21" font-weight="700" fill="#0a74c4" text-anchor="middle">450 à 1 000 €</text>
<text x="130" y="141" font-size="13" fill="#3d525c" text-anchor="middle">milieu de gamme : 600 à 900 €</text>
<rect x="254" y="62" width="212" height="104" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="360" y="90" font-size="13" fill="#61747d" text-anchor="middle">Budget pour 12 à 20 m²</text>
<text x="360" y="118" font-size="21" font-weight="700" fill="#0a74c4" text-anchor="middle">6 000 à 20 000 €</text>
<text x="360" y="141" font-size="13" fill="#3d525c" text-anchor="middle">environ, pergola posée</text>
<rect x="484" y="62" width="212" height="104" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="590" y="90" font-size="13" fill="#61747d" text-anchor="middle">Motorisation des lames</text>
<text x="590" y="118" font-size="21" font-weight="700" fill="#0a74c4" text-anchor="middle">800 à 2 000 €</text>
<text x="590" y="141" font-size="13" fill="#3d525c" text-anchor="middle">jusqu’à 2 500 € selon le type</text>
<text x="30" y="196" font-size="15" font-weight="700" fill="#13232b">Quelle formalité pour une pergola indépendante ?</text>
<rect x="24" y="208" width="196" height="58" rx="12" fill="#e8f6ee" stroke="#1f8a4c" stroke-width="2"/>
<text x="122" y="230" font-size="13" fill="#3d525c" text-anchor="middle">5 m² ou moins</text>
<text x="122" y="252" font-size="15" font-weight="700" fill="#1f8a4c" text-anchor="middle">Aucune formalité</text>
<rect x="226" y="208" width="232" height="58" rx="12" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="342" y="230" font-size="13" fill="#3d525c" text-anchor="middle">De 5 à 20 m²</text>
<text x="342" y="252" font-size="15" font-weight="700" fill="#0a74c4" text-anchor="middle">Déclaration préalable</text>
<rect x="464" y="208" width="232" height="58" rx="12" fill="#fff4e3" stroke="#b5600b" stroke-width="2"/>
<text x="580" y="230" font-size="13" fill="#3d525c" text-anchor="middle">Plus de 20 m²</text>
<text x="580" y="252" font-size="15" font-weight="700" fill="#b5600b" text-anchor="middle">Permis de construire</text>
<text x="30" y="290" font-size="13.5" fill="#3d525c">Adossée (extension), zone U d’un PLU : déclaration jusqu’à 40 m², permis au-delà</text>
<rect x="24" y="306" width="672" height="62" rx="12" fill="#e6f6f6"/>
<text x="44" y="332" font-size="13.5" fill="#13232b">Livraison : kit 2 à 4 semaines, sur-mesure 6 à 10 semaines · pose : 1 à 3 jours</text>
<text x="44" y="354" font-size="13.5" fill="#3d525c">Avec une déclaration préalable (1 mois d’instruction) : lancer en février ou mars</text>
</g>
</svg>
