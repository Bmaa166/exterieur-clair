<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Prix d’une clôture au mètre, pose comprise (2026)</title>
<desc id="d">Prix TTC au mètre linéaire, pose comprise : grillage souple 30 à 100 €, panneaux rigides 35 à 120 €, bois 80 à 200 €, PVC 50 à 180 €, aluminium 150 à 380 €, composite 100 à 185 €, mur parpaing ou béton 110 à 215 €. Portail motorisé posé : environ 2 000 à 8 000 € selon Travaux.com. Une déclaration est souvent exigée par la commune, et toujours pour un mur de 2 m ou plus. TVA à 10 % si la maison a plus de 2 ans.</desc>
