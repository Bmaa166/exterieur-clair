<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Prix d’une terrasse au m² selon le matériau (2026)</title>
<desc id="d">Prix TTC au m², pose comprise : bois résineux (pin, douglas) 80 à 160 €, bois exotique 110 à 240 €, composite 70 à 270 € (prix très divergents), carrelage sur dalle béton 100 à 150 €, carrelage sur plots 80 à 170 €, béton 50 à 210 € selon la finition. Une terrasse de plain-pied ne demande aucune formalité, sauf en secteur protégé. Le meilleur moment pour la commander est l’hiver.</desc>
<defs><clipPath id="c"><rect width="720" height="400" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="400" fill="#f4f9fd"/>
<text x="30" y="42" font-size="21" font-weight="700" fill="#13232b">Prix d’une terrasse au m² selon le matériau (2026)</text>
<text x="30" y="66" font-size="13" fill="#61747d">Prix TTC au m², pose comprise</text>
<line x1="228" y1="78" x2="228" y2="320" stroke="#d6e2e6" stroke-width="2"/>
<text x="214" y="97" font-size="14" fill="#13232b" text-anchor="end">Bois résineux</text>
<text x="214" y="112" font-size="12.5" fill="#61747d" text-anchor="end">pin, douglas</text>
<rect x="361.9" y="86" width="133.9" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="428.9" y="104" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">80 à 160 €</text>
<text x="214" y="144" font-size="14" fill="#13232b" text-anchor="end">Bois exotique</text>
<rect x="412.1" y="126" width="217.6" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="521" y="144" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">110 à 240 €</text>
<text x="214" y="177" font-size="14" fill="#13232b" text-anchor="end">Composite</text>
<text x="214" y="192" font-size="12.5" fill="#61747d" text-anchor="end">prix très divergents</text>
<rect x="345.2" y="166" width="334.8" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="512.6" y="184" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">70 à 270 €</text>
<text x="214" y="224" font-size="14" fill="#13232b" text-anchor="end">Carrelage sur dalle béton</text>
<rect x="395.4" y="206" width="83.7" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="487.1" y="224" font-size="13" font-weight="700" fill="#0a74c4">100 à 150 €</text>
<text x="214" y="264" font-size="14" fill="#13232b" text-anchor="end">Carrelage sur plots</text>
<rect x="361.9" y="246" width="150.7" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="437.3" y="264" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">80 à 170 €</text>
<text x="214" y="297" font-size="14" fill="#13232b" text-anchor="end">Béton</text>
<text x="214" y="312" font-size="12.5" fill="#61747d" text-anchor="end">selon la finition</text>
<rect x="311.7" y="286" width="267.9" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="445.6" y="304" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">50 à 210 €</text>
<rect x="24" y="330" width="672" height="56" rx="12" fill="#e6f6f6"/>
<text x="44" y="353" font-size="14" font-weight="700" fill="#0e7c86">De plain-pied : aucune formalité (sauf secteur protégé)</text>
<text x="44" y="374" font-size="13.5" fill="#3d525c">Meilleur moment pour la commander : l’hiver</text>
