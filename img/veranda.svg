<text x="30" y="66" font-size="13" fill="#61747d">Prix TTC au m², pose comprise</text>
<line x1="154" y1="76" x2="154" y2="198" stroke="#d6e2e6" stroke-width="2"/>
<text x="140" y="102" font-size="14" fill="#13232b" text-anchor="end">PVC</text>
