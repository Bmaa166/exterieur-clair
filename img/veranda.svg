<text x="140" y="142" font-size="14" fill="#13232b" text-anchor="end">Aluminium</text>
<rect x="351.2" y="124" width="180.8" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="441.7" y="142" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">1 200 à 2 300 €</text>
<text x="140" y="182" font-size="14" fill="#13232b" text-anchor="end">Bois</text>
<rect x="400.6" y="164" width="279.4" height="26" rx="13" fill="#e3f1fb" stroke="#0a74c4" stroke-width="2"/>
<text x="540.3" y="182" font-size="13" font-weight="700" fill="#0a74c4" text-anchor="middle">1 500 à 3 200 €</text>
<text x="30" y="222" font-size="15" font-weight="700" fill="#13232b">Démarches : une véranda est une extension</text>
<rect x="24" y="234" width="330" height="88" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="42" y="260" font-size="14" font-weight="700" fill="#0e7c86">En zone U d’un PLU</text>
<text x="42" y="284" font-size="13.5" fill="#3d525c">40 m² ou moins : déclaration préalable</text>
<text x="42" y="306" font-size="13.5" fill="#3d525c">Plus de 40 m² : permis de construire</text>
<rect x="366" y="234" width="330" height="88" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="384" y="260" font-size="14" font-weight="700" fill="#0e7c86">Hors zone U</text>
<text x="384" y="284" font-size="13.5" fill="#3d525c">20 m² ou moins : déclaration préalable</text>
<text x="384" y="306" font-size="13.5" fill="#3d525c">Plus de 20 m² : permis de construire</text>
