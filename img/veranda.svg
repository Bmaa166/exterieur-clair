<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
<title id="t">Véranda : prix au m² et démarches (2026)</title>
<desc id="d">Prix TTC au m², pose comprise : PVC 700 à 1 800 €, aluminium 1 200 à 2 300 €, bois 1 500 à 3 200 €. En zone U d’un PLU : déclaration préalable jusqu’à 40 m², permis de construire au-delà. Hors zone U : déclaration préalable jusqu’à 20 m², permis au-delà. Instruction : 1 mois pour une déclaration, 2 mois pour un permis. Taxe d’aménagement due, déclaration aux impôts dans les 90 jours.</desc>
<defs><clipPath id="c"><rect width="720" height="400" rx="18"/></clipPath></defs>
