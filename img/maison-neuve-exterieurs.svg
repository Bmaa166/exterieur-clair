<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d">
<title id="t">Maison neuve : par quoi commencer ?</title>
<desc id="d">Ordre conseillé des travaux extérieurs d’une maison neuve, après avoir vérifié le règlement de lotissement et les règles de la mairie : 1. clôture et portail (prévoir les gaines du portail motorisé), 2. terrasse (aucune formalité de plain-pied, à commander l’hiver), 3. pergola (posée sur la terrasse en 1 à 3 jours), 4. piscine, le projet le plus lourd, en dernier. Piège de la TVA : 20 % si le logement est achevé depuis moins de 2 ans, 10 % au-delà de 2 ans.</desc>
<defs><clipPath id="c"><rect width="720" height="352" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="352" fill="#f4f9fd"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#13232b">Maison neuve : par quoi commencer ?</text>
<text x="30" y="66" font-size="13.5" fill="#61747d">Vérifiez d’abord le règlement de lotissement et les règles de la mairie</text>
<line x1="99" y1="112" x2="621" y2="112" stroke="#0a74c4" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
<circle cx="99" cy="112" r="22" fill="#fff" stroke="#0a74c4" stroke-width="3"/><text x="99" y="119.92" font-size="22" font-weight="700" fill="#0a74c4" text-anchor="middle">1</text>
<rect x="16" y="150" width="166" height="108" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="99" y="178" font-size="14.5" font-weight="700" fill="#13232b" text-anchor="middle">Clôture et portail</text>
<text x="99" y="204" font-size="13" fill="#3d525c" text-anchor="middle">Prévoir les gaines</text>
<text x="99" y="223" font-size="13" fill="#3d525c" text-anchor="middle">du portail motorisé</text>
<circle cx="273" cy="112" r="22" fill="#fff" stroke="#0a74c4" stroke-width="3"/><text x="273" y="119.92" font-size="22" font-weight="700" fill="#0a74c4" text-anchor="middle">2</text>
<rect x="190" y="150" width="166" height="108" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="273" y="178" font-size="14.5" font-weight="700" fill="#13232b" text-anchor="middle">Terrasse</text>
<text x="273" y="204" font-size="13" fill="#3d525c" text-anchor="middle">De plain-pied :</text>
<text x="273" y="223" font-size="13" fill="#3d525c" text-anchor="middle">aucune formalité</text>
<text x="273" y="242" font-size="13" fill="#3d525c" text-anchor="middle">à commander l’hiver</text>
<circle cx="447" cy="112" r="22" fill="#fff" stroke="#0a74c4" stroke-width="3"/><text x="447" y="119.92" font-size="22" font-weight="700" fill="#0a74c4" text-anchor="middle">3</text>
<rect x="364" y="150" width="166" height="108" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="447" y="178" font-size="14.5" font-weight="700" fill="#13232b" text-anchor="middle">Pergola</text>
<text x="447" y="204" font-size="13" fill="#3d525c" text-anchor="middle">Posée sur la terrasse</text>
<text x="447" y="223" font-size="13" fill="#3d525c" text-anchor="middle">en 1 à 3 jours</text>
<circle cx="621" cy="112" r="22" fill="#fff" stroke="#0a74c4" stroke-width="3"/><text x="621" y="119.92" font-size="22" font-weight="700" fill="#0a74c4" text-anchor="middle">4</text>
<rect x="538" y="150" width="166" height="108" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="621" y="178" font-size="14.5" font-weight="700" fill="#13232b" text-anchor="middle">Piscine</text>
<text x="621" y="204" font-size="13" fill="#3d525c" text-anchor="middle">Le projet le plus</text>
<text x="621" y="223" font-size="13" fill="#3d525c" text-anchor="middle">lourd : en dernier</text>
<rect x="24" y="274" width="672" height="62" rx="14" fill="#fff4e3" stroke="#f2a516" stroke-width="2"/>
<text x="44" y="299" font-size="15" font-weight="700" fill="#b5600b">Le piège de la TVA</text>
<text x="44" y="322" font-size="13.5" fill="#13232b">Logement achevé depuis moins de 2 ans : TVA à 20 % · plus de 2 ans : TVA à 10 %</text>
</g>
</svg>
