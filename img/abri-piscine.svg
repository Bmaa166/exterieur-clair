<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d">
<title id="t">Abri de piscine : la formalité selon la hauteur</title>
<desc id="d">Pour un bassin de 10 m² ou moins : aucune formalité, que l’abri fasse 1,80 m ou moins ou plus de 1,80 m (déclaration en secteur protégé). De 10 à 100 m² : déclaration préalable avec un abri de 1,80 m ou moins, permis de construire au-delà de 1,80 m. Plus de 100 m² : permis de construire dans tous les cas. Un abri coûte environ 5 000 à 25 000 € pour un bassin 8 × 4 m ; conforme à la norme NF P90-309, il sert de dispositif de sécurité ; il réduit la consommation d’eau de 65 à 75 % sur la saison selon la FPP.</desc>
<defs><clipPath id="c"><rect width="720" height="380" rx="18"/></clipPath></defs>
<g clip-path="url(#c)" font-family="Arial,Helvetica,sans-serif">
<rect width="720" height="380" fill="#f4f9fd"/>
<text x="30" y="42" font-size="22" font-weight="700" fill="#13232b">Abri de piscine : la formalité selon la hauteur</text>
<text x="335" y="80" font-size="14" font-weight="700" fill="#13232b" text-anchor="middle">Abri de 1,80 m ou moins</text>
<text x="573" y="80" font-size="14" font-weight="700" fill="#13232b" text-anchor="middle">Abri de plus de 1,80 m</text>
<text x="30" y="126" font-size="14" fill="#13232b">Bassin de 10 m² ou moins</text>
