<text x="335" y="185" font-size="14.5" font-weight="700" fill="#0a74c4" text-anchor="middle">Déclaration préalable</text>
<rect x="456" y="154" width="234" height="52" rx="12" fill="#fff4e3" stroke="#b5600b" stroke-width="2"/>
<text x="573" y="185" font-size="14.5" font-weight="700" fill="#b5600b" text-anchor="middle">Permis de construire</text>
<text x="30" y="246" font-size="14" fill="#13232b">Plus de 100 m²</text>
<rect x="218" y="214" width="234" height="52" rx="12" fill="#fff4e3" stroke="#b5600b" stroke-width="2"/>
<text x="335" y="245" font-size="14.5" font-weight="700" fill="#b5600b" text-anchor="middle">Permis de construire</text>
<rect x="456" y="214" width="234" height="52" rx="12" fill="#fff4e3" stroke="#b5600b" stroke-width="2"/>
<text x="573" y="245" font-size="14.5" font-weight="700" fill="#b5600b" text-anchor="middle">Permis de construire</text>
<rect x="24" y="290" width="212" height="74" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
<text x="130" y="322" font-size="19" font-weight="700" fill="#0a74c4" text-anchor="middle">5 000 à 25 000 €</text>
<text x="130" y="345" font-size="13" fill="#3d525c" text-anchor="middle">pour un bassin 8 × 4 m</text>
