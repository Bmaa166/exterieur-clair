<text x="360" y="322" font-size="19" font-weight="700" fill="#0a74c4" text-anchor="middle">NF P90-309</text>
<text x="360" y="345" font-size="13" fill="#3d525c" text-anchor="middle">norme du dispositif de sécurité</text>
<rect x="484" y="290" width="212" height="74" rx="14" fill="#fff" stroke="#dde8ea" stroke-width="2"/>
